<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Matheus Zanin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111'/%3E%3Cpath d='M9 9h14v3L13.5 20H23v3H9v-3l9.5-8H9z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f4f2; --ink:#0d0d0d; --mute:#6b6b6b; --mono:"JetBrains Mono", ui-monospace, Consolas, monospace; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100svh; display:grid; place-content:center; gap:28px; padding:24px 16px; background:var(--bg); color:var(--ink); font:14px/1.6 var(--mono); }
  h1 { font:800 clamp(96px,22vw,260px)/.85 Syne, sans-serif; letter-spacing:-.04em; }
  p { color:var(--mute); overflow-wrap:anywhere; }
  p b { color:var(--ink); font-weight:600; }
  a { justify-self:start; color:var(--ink); border:1.5px solid var(--ink); padding:8px 14px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; font-size:12px; text-decoration:none; }
  a:hover, a:focus-visible { background:var(--ink); color:var(--bg); }
  .caret { animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion:reduce) { .caret { animation:none; } }
</style>
</head>
<body>
  <h1>404</h1>
  <p><b>$ cd ~<span id="path">/pagina</span></b><br>bash: cd: No such file or directory<span class="caret" aria-hidden="true">▍</span></p>
  <a href="/portfolio/">← voltar pro portfólio</a>
  <script>
    // show the path that was asked for, relative to the portfolio root
    const p = decodeURIComponent(location.pathname).replace(/^\/portfolio/, "");
    if (p && p !== "/") document.getElementById("path").textContent = p;
  </script>
</body>
</html>
